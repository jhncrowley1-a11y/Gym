<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hybrid Race Programme</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#f5f7fb,#eef2f7);color:#1f2d3d;margin:0;padding:14px}
main{max-width:1050px;margin:auto}
h1{color:#12395c;text-align:center;margin:10px 0}
h2,h3{color:#174c72;margin:8px 0}
section{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px rgba(20,40,70,.08)}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid #d6dee8;padding:8px;text-align:center;font-size:13px}
th{background:#174c72;color:#fff}
.sup{border-left:6px solid #2e86de;background:#eaf3fd;padding:10px;margin:10px 0;border-radius:8px;font-weight:bold}
.tri{border-left:6px solid #8e44ad;background:#f6eefb;padding:10px;margin:10px 0;border-radius:8px;font-weight:bold}
.sled{border-left:6px solid #ff8c42;background:#fff4ec;padding:10px;margin:10px 0;border-radius:8px}
.cond{border-left:6px solid #27ae60;background:#eafaf1;padding:10px;margin:10px 0;border-radius:8px}
input,select,button,textarea{padding:8px;margin:3px 0;font-size:14px;max-width:100%;border-radius:6px;border:1px solid #c9d4de}
input[type=number]{width:110px}
button{background:#174c72;color:#fff;border:none;cursor:pointer}
button:hover{background:#12395c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:#5b6b7b}
.scroll{overflow:auto}
.tab{padding:10px 16px;border:none;background:#12395c;color:#cfe3f5;cursor:pointer;border-radius:8px 8px 0 0}
.tab.active{background:#fff;color:#174c72;font-weight:bold;box-shadow:0 -2px 6px rgba(0,0,0,.08)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.hidden{display:none}

@media (max-width: 700px) {
  #mainbox th:nth-child(4), #mainbox td:nth-child(4),
  #supbox th:nth-child(4), #supbox td:nth-child(4),
  #tribox th:nth-child(4), #tribox td:nth-child(4),
  #condbox th:nth-child(4), #condbox td:nth-child(4) { display: none; }
}
@media (max-width: 700px) {
  #olybox th:nth-child(1), #olybox td:nth-child(1),
  #olybox th:nth-child(3), #olybox td:nth-child(3),
  #olybox th:nth-child(7), #olybox td:nth-child(7) { display: none; }
  #olybox table { table-layout: fixed; width: 100%; }
  #olybox th, #olybox td { padding: 4px 2px; font-size: 11.5px; text-align: center; }
  #olybox td input { width: 100%; min-width: 0; box-sizing: border-box; font-size: 13.5px; padding: 6px 2px; }
}
@media (max-width: 700px) {
  #runtrack th:nth-child(4), #runtrack td:nth-child(4),
  #runtrack th:nth-child(5), #runtrack td:nth-child(5),
  #runtrack th:nth-child(6), #runtrack td:nth-child(6),
  #runtrack th:nth-child(9), #runtrack td:nth-child(9),
  #runtrack th:nth-child(10), #runtrack td:nth-child(10) { display: none; }
  #runtrack table { table-layout: fixed; width: 100%; }
  #runtrack th, #runtrack td { padding: 4px 2px; font-size: 11px; text-align: center; }
  #runtrack td input { width: 100%; min-width: 0; box-sizing: border-box; font-size: 12.5px; padding: 5px 2px; }
  #runtrack td input[type=checkbox] { width: auto; }
  #runtrack td select { width: 100%; max-width: 100%; box-sizing: border-box; font-size: 11px; padding: 3px 2px; }
}
.sup .supsel-label, .tri .supsel-label { font-size:11px; color:#5b6b7b; display:block; margin-top:6px; }
.sup select.supdd, .sup input[type=text].supex,
.tri select.supdd, .tri input[type=text].supex { width:100%; max-width:100%; box-sizing:border-box; font-size:13px; padding:6px; margin:4px 0; }

</style></head><body><main>
<h1>Hybrid Race Programme</h1>
<div class="tabs" id="tabs"></div>
<section><h2>Weekly readiness</h2><div class="row"><label>Stress <input id="stress" type="number" min="0" max="3" step="0.1"></label><label>Sleep (h) <input id="sleep" type="number" step="0.1"></label><label>Motivation <input id="mot" type="number" min="0" max="10"></label></div><p id="ready" class="note"></p></section>
<section><h2>Body weight</h2><div class="row"><label>Weight (kg) <input id="bw" type="number" step="0.1"></label><label>Waist (cm) <input id="waist" type="number" step="0.1"></label><label>Note <input id="bnote" type="text"></label></div><p id="metrics" class="note"></p></section>
<section><h2 id="btitle"></h2><p id="bfocus" class="note"></p><div class="row"><label>Day <select id="day"></select></label><label>Week <select id="week"></select></label><label>Start date <input id="start" type="date"></label></div><p id="dates" class="note"></p><p id="status" class="note"></p><label id="sledwrap"><input id="sled" type="checkbox"> Sled available this session</label></section>
<section><h2>Olympic lift</h2><div class="row"><label>Choose <select id="oly"></select></label></div><div id="olybox"></div></section>
<section><h2>Main lift</h2><div id="mainbox"></div></section>
<section><h2>Accessory supersets</h2><div id="supbox"></div></section>
<section><h2>Arms and shoulders triset</h2><div id="tribox"></div></section>
<section><h2>Core</h2><button id="corebtn">Generate core session</button><p id="coreout" class="note"></p></section>
<section><h2>Conditioning</h2><div id="condbox"></div><button id="condbtn">Generate alternative conditioning</button><p id="condout" class="note"></p></section>
<section><h2>Running</h2><div class="row"><label>Tuesday <select id="runtue"></select></label><label>Saturday <select id="runsat"></select></label></div><div id="runtrack"></div></section>
<section><h2>Deload</h2><p id="deload" class="note"></p></section>
<section><h2>Injury prevention</h2><div class="row"><label>Focus <select id="pre"><option>Calf and Achilles</option><option>Hamstring and hip</option><option>Shoulder and upper back</option><option>Core and trunk</option><option>Full-body prehab</option></select></label></div><p id="preout" class="note"></p></section>
<section><h2>Session notes</h2><textarea id="notes" rows="3" style="width:100%"></textarea><p id="storage" class="note"></p><button id="save">Download backup</button><label>Restore <input id="load" type="file" accept="application/json"></label></section>
</main>

function renderOly(){var box=$('olybox');box.innerHTML='';var lift=$('oly').value;if(lift==='None'){box.innerHTML='<p class="note">No Olympic lift selected.</p>';return}var t=document.createElement('table');var head=document.createElement('tr');['Exercise','Set','Prescription','Suggested load','Actual load','Reps','RPE'].forEach(function(x){var th=document.createElement('th');th.textContent=x;head.appendChild(th)});t.appendChild(head);for(var s=1;s<=4;s++){var tr=document.createElement('tr');var c1=document.createElement('td');c1.textContent=lift;tr.appendChild(c1);var c2=document.createElement('td');c2.textContent=s;tr.appendChild(c2);var c3=document.createElement('td');c3.textContent='4 x 3 at RPE 7';tr.appendChild(c3);var c4=document.createElement('td');var prev=db[key(cur,day,week-1,lift,s)];var n=prev?Number(prev):NaN;c4.textContent=(week===1||isNaN(n))?'-':(n+2.5).toFixed(2);tr.appendChild(c4);var c5=document.createElement('td');var i1=document.createElement('input');i1.type='number';i1.step='0.25';i1.value=db[key(cur,day,week,lift,s)]||'';i1.oninput=function(){db[key(cur,day,week,lift,s)]=i1.value;save()};c5.appendChild(i1);tr.appendChild(c5);var c6=document.createElement('td');var i2=document.createElement('input');i2.type='number';i2.value=db['reps|'+key(cur,day,week,lift,s)]||'';i2.oninput=function(){db['reps|'+key(cur,day,week,lift,s)]=i2.value;save()};c6.appendChild(i2);tr.appendChild(c6);var c7=document.createElement('td');var i3=document.createElement('input');i3.type='number';i3.min='1';i3.max='10';i3.value=db['rpe|'+key(cur,day,week,lift,s)]||'';i3.oninput=function(){db['rpe|'+key(cur,day,week,lift,s)]=i3.value;save()};c7.appendChild(i3);tr.appendChild(c7);t.appendChild(tr)}box.appendChild(t)}

function paceFor(d,w){var dist=Number(db['run|'+cur+'|'+d+'|'+w+'|dist']);var time=Number(db['run|'+cur+'|'+d+'|'+w+'|time']);if(!dist||!time||isNaN(dist)||isNaN(time)||dist<=0)return 0;return time/dist}

function suggestRun(d,w){if(w===1)return '-';var bad=db['run|'+cur+'|'+d+'|'+(w-1)+'|bad']==='1';var dist=Number(db['run|'+cur+'|'+d+'|'+(w-1)+'|dist']);var pace=paceFor(d,w-1);if(!dist||!pace)return '-';if(bad)return 'Repeat last good week: '+dist.toFixed(1)+' km at '+pace.toFixed(2)+' min/km';var curP=paceFor(d,w-1);var improving=curP<paceFor(d,w-1);if(improving)return 'Increase to '+(dist*1.05).toFixed(1)+' km at '+pace.toFixed(2)+' min/km';return 'Repeat '+dist.toFixed(1)+' km at '+pace.toFixed(2)+' min/km'}
